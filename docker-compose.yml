services:
  api:
    build:
      context: .
      target: development
    container_name: nestjs-docker-api
    ports:
      - "${PORT:-3000}:3000"
      - "9229:9229" # debugger (start:debug)
    env_file:
      - .env
    environment:
      DB_HOST: mariadb
    depends_on:
      mariadb:
        condition: service_healthy
    networks:
      - app-network
    # Con `docker compose watch` no necesitamos bind mounts: Compose sincroniza
    # los archivos dentro del contenedor y `nest start --watch` recompila solo.
    develop:
      watch:
        # Sincroniza el código fuente en caliente (hot reload de Nest)
        - action: sync
          path: ./src
          target: /app/src
        - action: sync
          path: ./public
          target: /app/public
        - action: sync
          path: ./test
          target: /app/test
        # Si cambian dependencias o configuración, reconstruye la imagen
        - action: rebuild
          path: ./package.json
        - action: rebuild
          path: ./package-lock.json
        - action: rebuild
          path: ./tsconfig.json
        - action: rebuild
          path: ./tsconfig.build.json
        - action: rebuild
          path: ./nest-cli.json
        - action: rebuild
          path: ./Dockerfile

  mariadb:
    image: mariadb:11
    container_name: nestjs-docker-mariadb
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootpass}
      MARIADB_DATABASE: ${DB_DATABASE:-nestjs_db}
      MARIADB_USER: ${DB_USERNAME:-nestjs}
      MARIADB_PASSWORD: ${DB_PASSWORD:-nestjs}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - mariadb-data:/var/lib/mysql
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s

  # Cliente web opcional para inspeccionar la base de datos en http://localhost:8080
  adminer:
    image: adminer:latest
    container_name: nestjs-docker-adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      - mariadb
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  mariadb-data:
